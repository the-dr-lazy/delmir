buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// SPIKE (delmir#43): op-sqlite 17.2.0 sets no ndkVersion and none of the libraries set
// buildToolsVersion, so AGP falls back to its defaults (NDK 28.2.13676358, build-tools 36.0.0),
// which the Nix SDK does not have. Pin every library to the app's NDK and build-tools.
subprojects {
    plugins.withId("com.android.library") {
        android {
            ndkVersion rootProject.ext.ndkVersion
            buildToolsVersion rootProject.ext.buildToolsVersion
        }
    }
}
