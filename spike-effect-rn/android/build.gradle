buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// SPIKE (delmir#43): op-sqlite 17.2.0 sets no ndkVersion, so AGP falls back to its default NDK
// (28.2.13676358), which the Nix SDK does not have. Pin every library to the app's NDK.
subprojects {
    plugins.withId("com.android.library") {
        android { ndkVersion rootProject.ext.ndkVersion }
    }
}
